name: Docker

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  cluster-windows:
    name: Cluster console (Windows CPU)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU training dependencies
        run: |
          python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-mt5.txt
      - name: Cluster service and real worker training tests
        run: python -m unittest discover -s tests -p 'test_cluster_*.py' -v
      - name: Dashboard JavaScript syntax
        run: node --check cluster_control/web/app.js

  cpu:
    name: CPU training (${{ matrix.target }}, ${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: cpu
            platform: linux/amd64
            machine: x86_64
            runner: ubuntu-latest
            compose-file: compose.yaml
          - target: mac
            platform: linux/arm64
            machine: aarch64
            runner: ubuntu-24.04-arm
            compose-file: compose.yaml:compose.mac.yaml
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      COMPOSE_FILE: ${{ matrix.compose-file }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build CPU image for ${{ matrix.platform }}
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          load: true
          tags: dtfm:${{ matrix.target }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max
      - name: Validate Compose
        run: |
          docker compose --profile '*' config --quiet
          docker compose -f compose.cluster.yaml config --quiet
          docker compose -f compose.cluster.yaml -f compose.cluster.gpu.yaml config --quiet
          docker compose -f compose.cluster.yaml -f compose.cluster.desktop.yaml config --quiet
          docker compose -f compose.cluster.yaml -f compose.cluster.desktop.yaml -f compose.cluster.gpu.yaml config --quiet
      - name: Check architecture and Gloo
        run: |
          docker compose run --rm --no-deps train python -c "import platform, torch; assert platform.machine() == '${{ matrix.machine }}'; assert torch.distributed.is_gloo_available(); print(platform.machine(), torch.__version__)"
      - name: Existing test suite and CPU smoke
        run: |
          docker compose run --rm --no-deps train test
          docker compose run --rm --no-deps train
          docker compose run --rm --no-deps -e DTFM_WORLD_SIZE=2 train
      - name: QA and summarization smoke tests
        run: |
          docker compose run --rm --no-deps train python scripts/run_macos_smoke.py --device cpu --mixed-cpu --workflow qa
          docker compose run --rm --no-deps train python scripts/run_macos_smoke.py --device cpu --mixed-cpu --workflow summarization
      - name: Train across two containers
        run: |
          docker compose up -d rank0 rank1
          timeout 180 docker compose wait rank0 rank1
          python3 - <<'PY'
          import json
          from pathlib import Path
          for rank in (0, 1):
              result = json.loads(Path(f'logs/compose-2rank/metrics_rank{rank}.json').read_text())
              assert result['rank'] == rank
              assert result['schedule']['completed_steps'] == 2
          PY
      - name: MLflow server and training demo
        run: |
          docker compose up -d --wait mlflow
          docker compose run --rm tracking-demo python scripts/run_mlflow_demo.py --tracking-uri http://mlflow:5000 --steps 2
      - name: Show service logs
        if: always()
        run: docker compose --profile '*' logs
      - name: Save measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-${{ matrix.target }}-measurements
          path: logs/
      - name: Stop containers
        if: always()
        run: docker compose --profile '*' down

  cuda-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build CUDA image (no GPU execution on hosted runner)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: cuda
          cache-from: type=gha,scope=cuda
          cache-to: type=gha,scope=cuda,mode=max
